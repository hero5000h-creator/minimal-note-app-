name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # A private key, if one has been added as a secret, wins over the one in
      # the repo. Nothing breaks when the secret is absent.
      - name: Use the private signing key when available
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE" | base64 -d > keystore/notes.keystore
          echo "Using the signing key from repository secrets."

      # Google Sign-In only works when this fingerprint is registered against
      # the app's package name in the Google Cloud console, so the build prints
      # it rather than leaving it to be dug out with keytool.
      - name: Report the signing fingerprint
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          PASS="${SIGNING_PASSWORD:-hanooot}"
          SHA1=$(keytool -list -v -keystore keystore/notes.keystore -alias notes \
                   -storepass "$PASS" 2>/dev/null \
                 | grep -m1 'SHA1:' | sed 's/.*SHA1: //')
          {
            echo "## Google Sign-In fingerprint"
            echo ""
            echo "Package name: \`com.hanooot.notes\`"
            echo ""
            echo "SHA-1: \`${SHA1}\`"
            echo ""
            echo "Both must be registered as an Android OAuth client at"
            echo "console.cloud.google.com for sign-in to work."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # Compile errors are re-emitted as GitHub annotations. Annotations are
      # readable through the API, unlike the raw log, so the failure can be
      # diagnosed without anyone copying text out of the web UI.
      - name: Publish errors as annotations
        if: steps.build.outcome == 'failure'
        run: |
          STRIP='s|file:///home/runner/work/[^/]*/[^/]*/||'

          if grep -q "^e: " build.log; then
            grep "^e: " build.log | sed "$STRIP" | head -40 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | sed 's|^e: ||' | tr '\n' ' ')
              echo "::error title=Kotlin::${clean}"
            done
          fi

          if grep -q "What went wrong" build.log; then
            sed -n '/What went wrong/,/^\* Try:/p' build.log \
              | sed "$STRIP" | head -20 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=Gradle::${line}"
            done
          fi

          # Nothing matched: surface the tail so there is always something to read
          if ! grep -q "^e: \|What went wrong" build.log; then
            tail -25 build.log | while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=Tail::${line}"
            done
          fi

          {
            echo "## Build failed"
            echo '```'
            grep "^e: " build.log | sed "$STRIP" | head -60 || tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 1

      # The GitHub mobile app cannot download workflow artifacts, and the web
      # download hands you a zip. A release asset is a plain direct link that
      # works in any browser, so the APK is published there too.
      - name: Publish the APK as a release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" notes.apk

          # Re-point the moving "latest" tag at this build.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest notes.apk \
            --title "Latest build" \
            --notes "Debug APK built from ${GITHUB_SHA:0:7} on $(date -u '+%Y-%m-%d %H:%M UTC')."

          echo "## APK ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/notes.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: notes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
